name: Demo
# This action is meant to be a demo that can be quickly edited on other branches and allow to test or demonstrate something.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: windows-2025
    steps:
      - name: "Checkout"
        uses: actions/checkout@v5
      - name: "Setup VBA Runtime"
        uses: DecimalTurn/setup-vba@797e4a232699a98507cb4411d5bea3697427ad57 # v0.3.0
        with:
          office-apps: "Excel"
          #office-language: en-en
      - name: "Build VBA-Enabled Documents"
        id: build_vba
        uses: DecimalTurn/VBA-Build@73d88e15e27d1e80aa402c60981175a491281d25 # v2.0.0
        with:
          source-dir: "./tests"
        timeout-minutes: 20
      - name: "Verify locale-sensitive formula"
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $workbookPath = Join-Path $PWD "tests/out/ExcelWorkbook.xlsm"
          $outputPath = Join-Path (Split-Path $workbookPath) "ExcelWorkbook_LocaleTest.txt"

          if (Test-Path $outputPath) { Remove-Item $outputPath -Force }

          $excel = New-Object -ComObject Excel.Application
          $excel.Visible = $false
          $excel.DisplayAlerts = $false
          $excel.AutomationSecurity = 1

          $workbook = $null
          try {
              $workbook = $excel.Workbooks.Open($workbookPath)
              $excel.Run("'$($workbook.Name)'!TestLocaleFormula")

              if (-not (Test-Path $outputPath)) {
                  throw "Expected output file was not created: $outputPath"
              }

              $actual = (Get-Content -Path $outputPath -Raw).Trim()
              if ($actual -ne "6") {
                  throw "Expected '6' but got '$actual'."
              }

              Write-Host "Locale formula test passed: $actual"
          }
          catch {
              Write-Host "::error::Locale formula test failed: $($_.Exception.Message)"
              throw
          }
          finally {
              if ($workbook) {
                  $workbook.Close($false)
                  [System.Runtime.Interopservices.Marshal]::ReleaseComObject($workbook) | Out-Null
              }
              $excel.Quit()
              [System.Runtime.Interopservices.Marshal]::ReleaseComObject($excel) | Out-Null
              [System.GC]::Collect()
              [System.GC]::WaitForPendingFinalizers()

              if (Test-Path $outputPath) { Remove-Item $outputPath -Force }
          }
      - name: "Upload Build Artifacts"
        uses: actions/upload-artifact@v4
        id: "upload"
        with:
          name: "VBA-Enabled-Documents"
          path: "./tests/out/*"
          if-no-files-found: warn
      - name: "Attestation"
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: "VBA-Enabled-Documents"
          subject-digest: sha256:${{ steps.upload.outputs.artifact-digest }}







